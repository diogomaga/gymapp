<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym App | Filmes & Séries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#FFD500" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    .movie-search {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      background: var(--panel-bg);
    }

    .movie-search input {
      flex: 1;
      padding: 10px 12px;
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      font: inherit;
      font-family: 'Nunito', sans-serif;
    }

    .movie-search button {
      padding: 10px 16px;
      background: var(--yellow);
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .movie-search button:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .movie-tabs {
      display: flex;
      gap: 8px;
      padding: 0 20px 12px;
      border-bottom: 2.5px solid var(--ink);
    }

    .movie-tab {
      padding: 8px 16px;
      background: transparent;
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .movie-tab--active {
      background: var(--yellow);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .movie-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .movie-player-container {
      padding: 12px 16px;
      flex: 1;
      overflow-y: auto;
      display: none;
      min-height: 0;
    }

    .movie-player-container.active {
      display: flex;
      flex-direction: column;
    }

    .movie-player {
      width: 100%;
      height: 100%;
      min-height: 500px;
      flex: 1;
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      background: #000;
      overflow: hidden;
      box-shadow: 4px 4px 0 var(--ink);
    }

    .movie-player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .movie-results {
      padding: 12px 20px;
      flex: 1;
      overflow-y: auto;
      display: none;
    }

    .movie-results.active {
      display: block;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .movie-item {
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      border: 2.5px solid var(--ink);
      transition: all 0.2s;
      aspect-ratio: 2/3;
    }

    .movie-item:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .movie-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .movie-item-loading {
      background: var(--panel-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }

    .movie-empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }

    .movie-loading {
      text-align: center;
      padding: 20px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <main class="app-page">
    <section class="app-screen">

      <!-- Header -->
      <header class="act-header">
        <p class="act-greeting">🎬 FILMES & SÉRIES</p>
        <button class="act-avatar-btn" aria-label="Perfil" onclick="location.href='../index.html'">
          <span class="avatar-ring"><span class="avatar-initials">JO</span></span>
          <span class="avatar-status" aria-hidden="true"></span>
        </button>
      </header>

      <!-- Tabs -->
      <div class="movie-tabs">
        <button class="movie-tab movie-tab--active" data-type="movie">🍿 Filmes</button>
        <button class="movie-tab" data-type="tv">📺 Séries</button>
      </div>

      <!-- Search -->
      <div class="movie-search">
        <input
          id="movie-search"
          type="text"
          placeholder="Procura um filme ou série..."
          autocomplete="off"
        />
        <button id="movie-search-btn">🔍</button>
      </div>

      <!-- Content -->
      <div class="movie-content">
        <!-- Player -->
        <div class="movie-player-container" id="player-container">
          <div class="movie-player" id="movie-player">
            <div style="padding: 20px; color: #999;">Selecciona um filme ou série</div>
          </div>
        </div>

        <!-- Results -->
        <div class="movie-results active" id="results-container">
          <div class="movie-empty">Procura por um filme ou série</div>
        </div>
      </div>

      <!-- Bottom Nav -->
      <nav class="bottom-nav">
        <button class="nav-btn" aria-label="Treino" onclick="location.href='activity.html'">
          <span class="nav-emoji">🏋️</span>
        </button>
        <button class="nav-btn nav-btn--active" aria-label="Filmes" aria-current="page">
          <span class="nav-emoji">🎬</span>
        </button>
        <button class="nav-btn" aria-label="AI Coach" onclick="location.href='ai-coach.html'">
          <span class="nav-emoji">🤖</span>
        </button>
        <button class="nav-btn" aria-label="Perfil" onclick="location.href='../index.html'">
          <span class="nav-emoji">👤</span>
        </button>
      </nav>

    </section>
  </main>

  <script src="/env.js"></script>
  <script src="../js/movies.js"></script>
  <script src="../js/sw-register.js"></script>
</body>
</html>
